# Streamlit 配置。
#
# 这台机器是无桌面的服务器，所以 headless 是必须的：否则 Streamlit 会尝试
# 打开浏览器并在首次运行时等待邮箱输入。

[server]
# 只监听回环地址。远程访问走 SSH 端口转发：
#     ssh -N -L 8501:127.0.0.1:8501 <user>@<host>
# 这个服务没有任何鉴权，不要直接暴露到局域网。
address = "127.0.0.1"
port = 8501
headless = true

# 关掉文件监听。outputs/ 可能有 GB 级产物，默认的 inotify watch 会拖慢启动
# 并触发意外重跑。开发时用命令行覆盖：--server.fileWatcherType auto
fileWatcherType = "none"

[browser]
gatherUsageStats = false

# 隐藏右上角的 Deploy 按钮与开发者菜单：这是个本地工具，不会部署到 Community Cloud。
[client]
toolbarMode = "minimal"

# 主题。这五个颜色是 Streamlit 原生支持的，改它们无需 CSS 就能影响所有内置组件；
# 卡片、徽章、间距这些更细的东西在 webui/theme.py 里用 CSS 补。
# 保持浅色是刻意的：页面里嵌的训练曲线/轨迹图都是白底 PNG，深色外壳会让它们
# 变成一块块刺眼的亮矩形。
# 五个色值与 webui/theme.py 顶部的常量对齐，改一处请同时改另一处。
[theme]
base = "light"
primaryColor = "#e4572e"
backgroundColor = "#f4f6f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#182126"
