# MiniGrid DoorKey: a sparse-reward grid world.
#
# The agent spawns in a room, must find a key, pick it up, unlock the door and
# reach the goal. Reward is zero everywhere except on success, so the entire
# learning signal is a single event at the end of an episode that lasts tens to
# hundreds of steps. That sparse-reward structure -- not the grid navigation
# itself -- is what makes this a real step up from the Empty-8x8 baseline, which
# pays out on every step.
#
# Size matters enormously here. At 5x5 this trains to a perfect score in roughly
# 40k steps. At 8x8 it is still at zero reward after 600k steps, because the key
# usually sits outside the 7x7 field of view and exploration collapses. Start
# here, then raise environment.id to the 6x6 or 8x8 variant to feel that cliff.
#
# `RecurrentPPO` is the default so the LSTM path is exercised end to end, but be
# aware that a memoryless `PPO` solves this task just as well and about twice as
# fast -- evidence that DoorKey is reactive ("see key, press pickup") and not a
# genuine memory task. Set algorithm.name to PPO to reproduce that comparison.
experiment:
  name: minigrid_doorkey
  seed: 42
  # Small LSTM policies run ~2x faster on a single torch thread; see _apply_torch_threads.
  torch_threads: 1

environment:
  id: MiniGrid-DoorKey-5x5-v0
  kwargs: {}
  # null keeps the environment default (10 * size^2 = 250 steps for 5x5).
  max_episode_steps: null
  wrappers: [minigrid_flat]
  attributes: {}
  monitor:
    allow_early_resets: true
    info_keywords: []
    reset_keywords: []

algorithm:
  name: RecurrentPPO
  device: cpu
  verbose: 1
  profiles:
    RecurrentPPO:
      policy: MlpLstmPolicy
      policy_kwargs:
        net_arch: [128, 128]
        lstm_hidden_size: 128
        n_lstm_layers: 1
        activation_fn: relu
      kwargs:
        learning_rate: 0.0003
        n_steps: 256
        batch_size: 64
        n_epochs: 4
        gamma: 0.99
        gae_lambda: 0.95
        clip_range: 0.2
        ent_coef: 0.01
        vf_coef: 0.5
        max_grad_norm: 0.5
    PPO:
      policy: MlpPolicy
      policy_kwargs:
        net_arch: [128, 128]
        activation_fn: relu
      kwargs:
        learning_rate: 0.0003
        n_steps: 256
        batch_size: 64
        n_epochs: 10
        gamma: 0.99
        gae_lambda: 0.95
        clip_range: 0.2
        ent_coef: 0.01
        vf_coef: 0.5
        max_grad_norm: 0.5

training:
  # 周期性记录动作分布与策略统计（排查策略坍缩用的关键证据）
  diagnostics:
    enabled: true
    interval: 10000
  total_timesteps: 200000
  log_interval: 1
  progress_bar: false
  reset_num_timesteps: true
  checkpoint:
    enabled: true
    save_freq: 50000
    directory: checkpoints
    name_prefix: doorkey

evaluation:
  enabled: true
  eval_freq: 10000
  n_eval_episodes: 20
  final_episodes: 25
  deterministic: true
  seed_offset: 10000

output:
  directory: outputs/minigrid_doorkey
  timestamped: false
  model_name: final_model
  logger_formats: [stdout, csv]
  save_resolved_config: true

visualization:
  training:
    enabled: true
    output_subdirectory: visualizations
    filename: training_results.png
    smoothing_window: 20
    dpi: 150
  trajectory:
    enabled: true
    generate_after_training: true
    model: final
    output_subdirectory: trajectories
    episodes: 3
    deterministic: true
    seed_offset: 20000
    max_steps: 250
    record_video: true
    video_format: mp4
    fps: 10
    macro_block_size: 8
    show_window: false
    save_plot: true
    save_data: true
    save_raw_observations: false
    observation_mode: summary
    dpi: 150
    observation_labels: [observation_mean, observation_std, observation_min, observation_max]
    phase_plots: []
